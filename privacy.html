@keyframes head{0%{left:0%}100%{left:100%}}
@keyframes fill{0%{width:0%}100%{width:100%}}
.blink{animation:blink 1.2s steps(1) infinite}
.track{position:relative;height:14px;background:repeating-linear-gradient(90deg,#1c1c1f 0 22px,#232327 22px 24px);border:1px solid #3a3940}

.ph{position:absolute;top:-8px;bottom:-8px;width:2px;background:#ff4a3d;box-shadow:0 0 8px #ff4a3d;animation:head 9s linear infinite}
@media (prefers-reduced-motion: reduce){.blink,.done,.ph{animation:none}.done{width:38%}.ph{left:38%}}
</style>
